services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/internship_tracker
      DB_USERNAME: internship_tracker_app
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: internship_tracker
      POSTGRES_USER: internship_tracker_app
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship_tracker_app -d internship_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
